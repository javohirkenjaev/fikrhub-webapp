<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FikrHub Pro Platformasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* PREMIUM DIZAYN (DARK & MINIMALISTIC) */
        :root {
            --bg: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text: var(--tg-theme-text-color, #f8fafc);
            --hint: var(--tg-theme-hint-color, #94a3b8);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --gold: #fbbf24;
            --gold-bg: rgba(251, 191, 36, 0.1);
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg); color: var(--text);
            padding: 0 0 80px 0; -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .app-header {
            padding: 20px 15px; background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .creator-badge { font-size: 11px; color: var(--hint); background: var(--bg); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); }

        /* Search */
        .search-area { padding: 15px; background: var(--bg); }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 16px; top: 16px; color: var(--hint); }
        .search-box input {
            width: 100%; padding: 14px 14px 14px 45px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; color: var(--text); font-size: 15px;
            outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        /* Containers */
        .section { display: none; padding: 0 15px; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Shop Cards */
        .shops-list { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .shop-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px; position: relative;
        }
        .shop-card.vip-card { border: 1px solid var(--gold); background: linear-gradient(145deg, var(--card-bg), var(--gold-bg)); }
        .shop-card.vip-card::after {
            content: '👑 VIP'; position: absolute; top: 15px; right: 15px;
            color: var(--gold); font-size: 12px; font-weight: bold; background: rgba(251,191,36,0.15); padding: 4px 8px; border-radius: 8px;
        }
        
        .shop-title { font-size: 18px; font-weight: 700; margin-bottom: 5px; padding-right: 50px; }
        .shop-meta { display: flex; gap: 10px; font-size: 12px; color: var(--hint); margin-bottom: 12px; }
        .shop-meta span { background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; }
        .shop-desc { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 15px; }
        
        /* Contact Grid */
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .contact-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600;
            text-decoration: none; transition: 0.2s; cursor: pointer;
        }
        .btn-tg { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
        .btn-ig { background: rgba(236, 72, 153, 0.1); color: #ec4899; border: 1px solid rgba(236, 72, 153, 0.2); }
        .btn-ph { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.2); grid-column: span 2; }

        /* Form Elements (For AI context) */
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--hint); margin: 15px 0 6px 0; }
        .form-input {
            width: 100%; padding: 14px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); outline: none; font-size: 14px;
        }
        .form-input:focus { border-color: var(--primary); }
        .main-btn {
            width: 100%; padding: 15px; background: var(--primary); color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
            margin-top: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        
        /* VIP Section */
        .vip-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--gold);
            padding: 25px 20px; border-radius: 20px; text-align: center; margin-top: 15px;
        }
        .vip-banner i.fa-crown { font-size: 45px; color: var(--gold); margin-bottom: 15px; }
        .vip-banner h2 { color: var(--text); font-size: 22px; margin-bottom: 10px; }
        .vip-features { text-align: left; margin: 20px 0; font-size: 14px; color: #cbd5e1; line-height: 1.8; }
        .vip-features li { list-style: none; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .vip-features li i { color: var(--gold); }
        .info-btn { background: transparent; border: 1px solid var(--hint); color: var(--hint); padding: 8px 15px; border-radius: 8px; font-size: 13px; cursor: pointer; }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--border); position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; color: var(--hint); font-size: 20px; cursor: pointer; }
        .card-number-box { background: #0f172a; border: 1px dashed var(--primary); padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; letter-spacing: 2px; text-align: center; margin: 20px 0; color: #fff; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 11px; gap: 5px; cursor: pointer; font-weight: 500; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <!-- Yuqori qism -->
    <header class="app-header">
        <div class="logo-text">FikrHub</div>
        <div class="creator-badge"><i class="fas fa-shield-alt"></i> Yaratuvchi: Javohir Kenjayev</div>
    </header>

    <!-- 1. ASOSIY SAHIFA: DO'KONLAR VA QIDIRUV -->
    <div id="tab-home" class="section active">
        <div class="search-area" style="padding: 15px 0;">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Do'kon nomi, manzili yoki mahsulot qidiring..." oninput="searchShops()">
            </div>
        </div>
        
        <div class="shops-list" id="shopsContainer">
            <!-- Do'konlar shu yerga JS orqali chiziladi -->
        </div>
    </div>

    <!-- 2. DO'KON QO'SHISH (Batafsil AI tahlili uchun) -->
    <div id="tab-add" class="section">
        <h2 style="margin: 15px 0; font-size: 22px;">Yangi loyiha kiritish</h2>
        <p style="color: var(--hint); font-size: 14px; margin-bottom: 20px;">Ma'lumotlarni to'liq kiriting. Bu platformamizning AI tizimi tavsiyalarida sizni to'g'ri topishiga yordam beradi.</p>
        
        <form id="addForm" onsubmit="saveShop(event)">
            <label class="form-label">Loyihangiz/Do'kon nomi</label>
            <input type="text" id="i_name" class="form-input" required placeholder="Masalan: Xorazm TexnoMarket">

            <label class="form-label">Faoliyat turi</label>
            <select id="i_category" class="form-input">
                <option value="Elektronika">Elektronika va Maishiy texnika</option>
                <option value="Ta'lim">Ta'lim, Kurslar va IT</option>
                <option value="Tibbiyot">Tibbiyot va Klinika</option>
                <option value="Oziq-ovqat">Oziq-ovqat, Kafe, Restoran</option>
                <option value="Xizmatlar">Xizmatlar (Go'zallik, Usta, Avto)</option>
                <option value="Boshqa">Boshqa do'konlar</option>
            </select>

            <label class
